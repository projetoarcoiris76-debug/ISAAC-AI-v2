<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ISAAC AI</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="grid">
    <main id="login" class="login">
      <div class="card">

        <div class="logo">🤖</div>

        <h1>ISAAC <span>AI</span></h1>

        <p>
          Seu companheiro IA.
          <strong>Sempre com você.</strong>
        </p>

        <form id="loginForm">

          <div class="password-box">
            <span>🔒</span>

            <input
              id="password"
              type="password"
              placeholder="Digite sua senha"
              required
            >

            <button
              type="button"
              id="showPassword"
              aria-label="Mostrar senha"
            >
              ◉
            </button>
          </div>

          <button class="enter" type="submit">
            ENTRAR
          </button>

          <div id="error"></div>

        </form>

        <div class="security">
          🛡️ Acesso restrito. Apenas para usuários autorizados.
        </div>

      </div>
    </main>
  </div>

 <div id="app" class="hidden">
  <div class="app">
    <aside>
      <div class="brand">GAMERULTRA <span>AI</span></div>

      <button class="nav active">🏠 Início</button>
      <button class="nav">💬 Conversar</button>
      <button class="nav">🎮 Criar jogos</button>
      <button class="nav">🤖 Criar IA</button>
    </aside>

    <div class="content">
      <header>
        <div>
          <h2>GAMERULTRA AI</h2>
          <p>Seu companheiro IA. <i>Online</i></p>
        </div>
      </header>

      <section class="hero">
        <div class="zak">🤖</div>
        <div>
          <strong>Olá! 👋</strong>
          <p>Fala aí! Sou o GAMERULTRA AI. Bora conversar?</p>
        </div>
      </section>

      <section class="chat">
        <div id="messages">
          <div class="msg">🤖 E aí! Finalmente você entrou! 😂</div>
        </div>

        <form id="chat">
          <input id="input" placeholder="Digite sua mensagem..." autocomplete="off">
          <button type="submit">➤</button>
        </form>
      </section>
    </div>
  </div>

<script src="app.js"></script>

</body>
</html>
