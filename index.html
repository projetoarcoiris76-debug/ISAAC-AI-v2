<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZAK — ISAAC AI</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- ================= LOGIN ================= -->
    <section id="login-screen">

        <div class="background-effects"></div>

        <div class="login-container">

            <!-- LOGO DOS DOIS RAIOS -->
            <div class="zak-logo">
                <span class="bolt blue-bolt">⚡</span>
                <span class="bolt gold-bolt">⚡</span>
            </div>

            <h1 class="zak-title">ZAK</h1>

            <p class="subtitle">SUA IA, SEM LIMITES</p>

            <div class="login-box">

                <h2>FAÇA SEU LOGIN</h2>

                <p class="login-description">
                    Digite sua senha para acessar o ZAK
                </p>

                <div class="password-container">

                    <span class="lock">🔒</span>

                    <input
                        type="password"
                        id="login-password"
                        placeholder="Digite sua senha..."
                        autocomplete="off"
                    >

                    <button
                        type="button"
                        id="show-password"
                        title="Mostrar senha"
                    >
                        👁️
                    </button>

                </div>

                <button id="login-button">
                    <span>⚡</span>
                    ENTRAR
                </button>

                <p id="login-error"></p>

                <p class="security-text">
                    🔐 Acesso restrito. Apenas usuários autorizados.
                </p>

            </div>

        </div>

    </section>


    <!-- ================= PAINEL DO ZAK ================= -->
    <main id="app">

        <header class="app-header">
            <div class="small-logo">
                <span>⚡</span>
                <span>⚡</span>
            </div>

            <div>
                <h1>ZAK</h1>
                <p>ISAAC AI</p>
            </div>
        </header>

        <section class="welcome">
            <h2>Bem-vindo ao ZAK ⚡</h2>
            <p>Seu acesso foi autorizado.</p>
        </section>

    </main>

    <script src="app.js"></script>

</body>
</html>
