<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>ZAK — ISAAC AI</title>

    <meta
        name="description"
        content="ZAK — Sua IA, sem limites."
    >

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- ==================================================
         TELA DE LOGIN
    =================================================== -->

    <div
        class="login-screen"
        id="loginScreen"
    >

        <div class="login-box">

            <!-- LOGO -->
            <div class="login-logo">

                <h1>ZAK</h1>

                <p>SUA IA, SEM LIMITES</p>

            </div>


            <!-- TÍTULO -->
            <div class="login-title">

                <h2>FAÇA SEU LOGIN</h2>

                <p>
                    Digite sua senha para acessar o ZAK
                </p>

            </div>


            <!-- SENHA -->
            <div class="password-container">

                <span class="lock-icon">
                    🔒
                </span>

                <input
                    type="password"
                    id="password"
                    placeholder="Digite sua senha..."
                    autocomplete="current-password"
                >

                <button
                    type="button"
                    id="togglePassword"
                    aria-label="Mostrar senha"
                >
                    👁️
                </button>

            </div>


            <!-- BOTÃO ENTRAR -->
            <button
                class="login-button"
                id="loginBtn"
                type="button"
            >
                ⚡ ENTRAR
            </button>


            <!-- ERRO -->
            <div
                class="login-error"
                id="loginError"
            ></div>


            <!-- AVISO -->
            <div class="login-warning">

                🔒 Acesso restrito.
                Apenas usuários autorizados.

            </div>

        </div>

    </div>


    <!-- ==================================================
         PAINEL DO ZAK
         FICA ESCONDIDO ATÉ O LOGIN
    =================================================== -->

    <main
        class="app"
        id="app"
        style="display: none;"
    >

        <!-- CABEÇALHO -->
        <header class="app-header">

            <div class="brand">

                <div class="brand-icon">
                    ⚡
                </div>

                <div>

                    <h1>ZAK</h1>

                    <span>
                        ISAAC AI
                    </span>

                </div>

            </div>


            <div class="status">

                <span class="status-dot"></span>

                ONLINE

            </div>

        </header>


        <!-- ==================================================
             ÁREA PRINCIPAL
        =================================================== -->

        <section class="chat-container">

            <!-- MENSAGEM INICIAL -->
            <div
                class="chat-messages"
                id="chatMessages"
            >

                <div class="message bot-message">

                    <div class="message-avatar">
                        ⚡
                    </div>

                    <div class="message-content">

                        <strong>ZAK</strong>

                        <p>
                            Sistema iniciado. ⚡
                            <br>
                            Fala aí! O que vamos fazer hoje?
                        </p>

                    </div>

                </div>

            </div>


            <!-- ==================================================
                 ÁREA DE DIGITAÇÃO
            =================================================== -->

            <div class="chat-input-area">

                <textarea
                    id="userInput"
                    placeholder="Digite sua mensagem..."
                    rows="1"
                ></textarea>

                <button
                    id="sendBtn"
                    type="button"
                    aria-label="Enviar mensagem"
                >
                    ⚡
                </button>

            </div>


            <!-- OPÇÕES -->
            <div class="quick-options">

                <button
                    type="button"
                    data-message="Quais coisas você consegue fazer?"
                >
                    🧠 O que você faz?
                </button>

                <button
                    type="button"
                    data-message="Quero criar um jogo."
                >
                    🎮 Criar jogo
                </button>

                <button
                    type="button"
                    data-message="Quero criar uma IA."
                >
                    🤖 Criar IA
                </button>

                <button
                    type="button"
                    data-message="Quero ver as opções."
                >
                    ⚙️ Opções
                </button>

            </div>

        </section>


        <!-- RODAPÉ -->
        <footer class="app-footer">

            <span>
                ZAK — ISAAC AI
            </span>

            <span>
                Sistema protegido ⚡
            </span>

        </footer>

    </main>


    <!-- ==================================================
         JAVASCRIPT
    =================================================== -->

    <script src="app.js"></script>

</body>

</html>
