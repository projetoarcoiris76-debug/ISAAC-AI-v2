<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ZAK — ISAAC AI</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- =========================
         TELA DE LOGIN
    ========================== -->

    <div id="loginScreen" class="login-screen">

        <div class="login-box">

            <div class="login-logo">
                <h1>ZAK</h1>
                <p>SUA IA, SEM LIMITES</p>
            </div>

            <div class="login-title">
                <h2>FAÇA SEU LOGIN</h2>

                <p>
                    Digite sua senha para acessar o ZAK
                </p>
            </div>

            <div class="password-container">

                <span class="lock-icon">🔒</span>

                <input
                    type="password"
                    id="password"
                    placeholder="Digite sua senha..."
                >

                <button
                    type="button"
                    id="togglePassword"
                >
                    👁️
                </button>

            </div>

            <button
                type="button"
                id="loginBtn"
                class="login-button"
            >
                ⚡ ENTRAR
            </button>

            <div
                id="loginError"
                class="login-error"
            ></div>

            <div class="login-warning">
                🔒 Acesso restrito. Apenas usuários autorizados.
            </div>

        </div>

    </div>


    <!-- =========================
         PAINEL DO ZAK
    ========================== -->

    <main id="app" class="app hidden">

        <header class="app-header">

            <div class="brand">

                <div class="brand-icon">
                    ⚡
                </div>

                <div>
                    <h1>ZAK</h1>
                    <span>ISAAC AI</span>
                </div>

            </div>

            <div class="status">
                <span class="status-dot"></span>
                ONLINE
            </div>

        </header>


        <section class="chat-container">

            <div
                id="chatMessages"
                class="chat-messages"
            >

                <div class="message bot-message">

                    <div class="message-avatar">
                        ⚡
                    </div>

                    <div class="message-content">

                        <strong>ZAK</strong>

                        <p>
                            Sistema iniciado. ⚡
                            <br>
                            Fala aí! O que vamos fazer hoje?
                        </p>

                    </div>

                </div>

            </div>


            <div class="chat-input-area">

                <textarea
                    id="userInput"
                    rows="1"
                    placeholder="Digite sua mensagem..."
                ></textarea>

                <button
                    id="sendBtn"
                    type="button"
                >
                    ⚡
                </button>

            </div>


            <div class="quick-options">

                <button type="button">
                    🧠 O que você faz?
                </button>

                <button type="button">
                    🎮 Criar jogo
                </button>

                <button type="button">
                    🤖 Criar IA
                </button>

                <button type="button">
                    ⚙️ Opções
                </button>

            </div>

        </section>


        <footer class="app-footer">
            ZAK — ISAAC AI
        </footer>

    </main>


    <script src="app.js"></script>

</body>

</html>
